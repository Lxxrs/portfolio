overrides:
  vite: "catalog:"
packageExtensions:
  "@vue/test-utils@*":
    dependencies:
      "@vue/compiler-dom": "*"
      "@vue/server-renderer": "*"
      vue: "*"
  "@tailwindcss/vite@*":
    peerDependenciesMeta:
      vite:
        optional: true
  "@vitejs/plugin-vue@^1.3.0":
    peerDependenciesMeta:
      vite:
        optional: true
  vite-plugin-pwa@*:
    peerDependenciesMeta:
      vite:
        optional: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vite-plus: 0.2.6
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
