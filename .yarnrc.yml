nodeLinker: node-modules

# Suppress YN0060: vite-plus-core is aliased as vite but has version 0.1.x,
# which doesn't satisfy ^6||^7||^8 peer ranges. This is expected and harmless.
logFilters:
  - code: YN0060
    level: discard

packageExtensions:
  "@vue/test-utils@*":
    dependencies:
      "@vue/compiler-dom": "*"
      "@vue/server-renderer": "*"
      "vue": "*"
  # vite-plus-core is aliased as vite but has version 0.1.x; mark vite peer as
  # optional for packages that check the version string against ^6||^7||^8
  "@tailwindcss/vite@*":
    peerDependenciesMeta:
      vite:
        optional: true
  "@vitejs/plugin-vue@*":
    peerDependenciesMeta:
      vite:
        optional: true
  "vite-plugin-pwa@*":
    peerDependenciesMeta:
      vite:
        optional: true
