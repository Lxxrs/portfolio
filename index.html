<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preload Critical Fonts -->
    <link
      rel="preload"
      href="/src/assets/jetbrains_mono_webfonts/JetBrainsMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/jetbrains_mono_webfonts/JetBrainsMono-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/jetbrains_mono_webfonts/JetBrainsMono-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Security headers (CSP, X-Content-Type-Options, X-Frame-Options,
         COOP, COEP, CORP, Permissions-Policy) are defined in vite.config.ts:
           dev / preview  → server.headers / preview.headers
           production     → <meta> (meta-compatible CSP subset) injected by
                            productionCSP() plugin + dist/_headers (full policy) -->

    <!-- Privacy & Anti-Indexing -->
    <meta name="robots" content="noindex, nofollow, noimageindex, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow" />
    <!-- Referrer-Policy: effective as a meta tag; also set as HTTP header in production -->
    <meta name="referrer" content="no-referrer" />

    <!-- Theme Color -->
    <meta name="color-scheme" content="dark light" />

    <title>Lars M. | System Engineer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
