# .forgejo/workflows/publish.yaml

name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: codeberg-tiny-lazy
    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: setup pnpm & install deps
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: format
        run: pnpm format

      - name: check & build
        run: |
          export BUILD_DATE="$(git log -1 --format=%cs)"
          export CI_COMMIT_SHA="${{ forge.sha }}"
          echo "building ${{ forge.sha }} dated $BUILD_DATE"
          pnpm build

      - name: publish to larmart.de
        uses: actions/git-pages@v2
        with:
          site: https://larmart.de/
          server: codeberg.page #(only needed on first run, if no TLS certicifate is present)
          token: ${{ forge.token }}
          source: dist/

      - name: publish to www.larmart.de
        uses: actions/git-pages@v2
        with:
          site: https://www.larmart.de/
          server: codeberg.page #(only needed on first run, if no TLS certicifate is present)
          token: ${{ forge.token }}
          source: dist/
