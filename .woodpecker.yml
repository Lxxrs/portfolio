steps:
  install:
    image: node:20-alpine
    commands:
      - npm ci

  lint:
    image: node:20-alpine
    commands:
      - npm run lint

  test:
    image: node:20-alpine
    commands:
      - npm run test -- --run

  build:
    image: node:20-alpine
    commands:
      - npm run build

  deploy:
    image: alpine/git:latest
    commands:
      # Save the dist directory
      - cp -r dist /tmp/dist
      
      # Configure Git
      - git config --global user.name "Woodpecker CI"
      - git config --global user.email "ci@codeberg.org"
      
      # Checkout or create pages branch
      - git fetch origin pages:pages || git branch pages
      - git checkout pages
      
      # Clean the branch (keep .git)
      - find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
      
      # Copy build artifacts
      - cp -r /tmp/dist/* .
      
      # Create .nojekyll file (prevents Jekyll processing on Codeberg Pages)
      - touch .nojekyll
      
      # Add CNAME if you have a custom domain
      # - echo "yourdomain.com" > CNAME
      
      # Commit and push
      - git add -A
      - |
        if git diff --staged --quiet; then
          echo "No changes to deploy"
        else
          git commit -m "Deploy: ${CI_COMMIT_SHA:0:7} from ${CI_COMMIT_BRANCH} [skip ci]"
          git push origin pages
        fi
    when:
      branch: main
      event: push

  # Example deployment to Hetzner via Rsync
  # Requires secrets: SSH_KEY, SSH_USER, SSH_HOST
  # deploy-server:
  #   image: drillster/drone-rsync
  #   settings:
  #     user:
  #       from_secret: SSH_USER
  #     key:
  #       from_secret: SSH_KEY
  #     host:
  #       from_secret: SSH_HOST
  #     source: ./dist/*
  #     target: /var/www/html/ # Or your specific path
  #     recursive: true
  #     delete: true
  #   when:
  #     branch: main
