# Portfolio CI/CD — validate -> build -> deploy (Codeberg Pages, git-pages)
# Secrets required: ssh_key (Ed25519 deploy key with write access)
variables:
  - &node_image "node:24-alpine"

when:
  event: push
  branch: main

steps:
  - name: validate
    image: *node_image
    commands:
      - apk add --no-cache git
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm exec prettier . --write

  - name: build
    image: *node_image
    commands:
      - corepack enable
      - pnpm run build
    depends_on: [validate]

  - name: deploy
    image: codeberg.org/sugar700/plugin-codeberg-pages-deploy:1
    settings:
      folder: dist
      ssh_key:
        from_secret: ssh_key
    depends_on: [build]
